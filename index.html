<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #121212;
      transition: background-color 0.4s ease;
      color: #f0f0f0;
      font-family: 'Barlow Condensed', sans-serif;
    }
    #display {
      font-size: clamp(8rem, min(40vw, 60vh), 24rem);
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      cursor: text;
      outline: none;
      border-bottom: 2px solid transparent;
      -webkit-tap-highlight-color: transparent;
    }
    #display::selection {
      background: transparent;
    }
    #display:focus {
      border-bottom-color: #444;
    }
    .alarm-active {
      color: #ff5252;
    }
  </style>
</head>
<body>

  <div id="display" contenteditable="true" spellcheck="false" aria-label="Timer duration MM:SS" title="Click to edit (MM:SS)">05:00</div>

  <script>
    const display = document.getElementById('display');

    let remainingSeconds = 300;
    let durationSeconds = 300;
    let timerId = null;
    let audioCtx = null;
    let editing = false;
    let editStartText = '';
    let wakeLock = null;
    let wakeLockRequested = false;

    function formatTime(secs) {
      const m = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = (secs % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function parseTime(text) {
      const parts = text.trim().split(':');
      if (parts.length !== 2) return null;
      const m = parseInt(parts[0], 10);
      const s = parseInt(parts[1], 10);
      if (!Number.isFinite(m) || !Number.isFinite(s)) return null;
      if (m < 0 || s < 0 || s > 59) return null;
      const total = m * 60 + s;
      if (total < 1 || total > 999 * 60 + 59) return null;
      return total;
    }

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTick() {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, ctx.currentTime);
      gain.gain.setValueAtTime(0.06, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.05);
    }

    function playChime() {
      const ctx = getAudioCtx();
      [0, 0.25, 0.5].forEach((offset, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const t = ctx.currentTime + offset;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(i === 2 ? 1046.5 : 880, t);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.3, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.21);
      });
    }

    function backgroundFor(secs) {
      let x = Math.imul(secs + 1, 0x9e3779b1) >>> 0;
      x ^= x >>> 16;
      x = Math.imul(x, 0x85ebca6b) >>> 0;
      x ^= x >>> 13;
      const hue = secs === 0 ? 0 : x % 360;
      const lightness = secs === 0 ? 17 : 14;
      return `hsl(${hue}, 45%, ${lightness}%)`;
    }

    function applyBackground(secs) {
      document.body.style.backgroundColor = backgroundFor(secs);
    }

    function updateDisplay() {
      if (editing) return;
      display.textContent = formatTime(remainingSeconds);
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
      releaseWakeLock();
    }

    async function requestWakeLock() {
      wakeLockRequested = true;
      if (!('wakeLock' in navigator) || wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          wakeLock = null;
          if (wakeLockRequested && document.visibilityState === 'visible') requestWakeLock();
        });
      } catch (err) {
        console.debug('Screen wake lock unavailable:', err);
      }
    }

    function releaseWakeLock() {
      wakeLockRequested = false;
      if (!wakeLock) return;
      const lock = wakeLock;
      wakeLock = null;
      lock.release().catch(() => {});
    }

    function startTimer() {
      if (timerId || remainingSeconds <= 0) return;
      getAudioCtx();
      requestWakeLock();
      timerId = setInterval(() => {
        remainingSeconds--;
        updateDisplay();

        if (remainingSeconds <= 0) {
          stopTimer();
          display.classList.add('alarm-active');
          applyBackground(0);
          playChime();
        } else {
          playTick();
        }
      }, 1000);
    }

    display.addEventListener('focus', () => {
      editing = true;
      editStartText = display.textContent;
      stopTimer();
      display.classList.remove('alarm-active');
    });

    display.addEventListener('touchstart', () => {
      stopTimer();
      display.classList.remove('alarm-active');
    }, { passive: true });

    function getCaretOffset() {
      const selection = window.getSelection();
      if (!selection.rangeCount) return display.textContent.length;
      const range = selection.getRangeAt(0);
      const before = range.cloneRange();
      before.selectNodeContents(display);
      before.setEnd(range.endContainer, range.endOffset);
      return before.toString().length;
    }

    function setCaretOffset(offset) {
      const selection = window.getSelection();
      const range = document.createRange();
      const node = display.firstChild || display.appendChild(document.createTextNode(''));
      range.setStart(node, Math.min(offset, node.textContent.length));
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function normalizeTimeInput() {
      const old = display.textContent;
      const caret = getCaretOffset();
      const caretDigits = old.slice(0, caret).replace(/\D/g, '').length;
      const digits = old.replace(/\D/g, '').slice(0, 4);
      const next = `${digits.slice(0, 2).padStart(2, '0')}:${digits.slice(2).padStart(2, '0')}`;
      display.textContent = next;
      setCaretOffset(Math.min(caretDigits + (caretDigits >= 2 ? 1 : 0), next.length));
    }

    display.addEventListener('input', () => {
      normalizeTimeInput();
      const secs = parseTime(display.textContent);
      if (secs !== null) applyBackground(secs);
    });

    display.addEventListener('blur', () => {
      editing = false;
      const text = display.textContent.trim();
      const secs = text === editStartText ? null : parseTime(text);
      if (secs !== null) {
        durationSeconds = secs;
        remainingSeconds = secs;
      } else if (remainingSeconds <= 0) {
        remainingSeconds = durationSeconds > 0 ? durationSeconds : 300;
      }
      updateDisplay();
      applyBackground(remainingSeconds);
      startTimer();
    });

    display.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        display.blur();
        startTimer();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        display.textContent = formatTime(remainingSeconds);
        display.blur();
      }
    });

    document.addEventListener('pointerdown', () => {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    });

    document.addEventListener('keydown', (event) => {
      if (event.code !== 'Space' || event.repeat || document.activeElement === display) return;
      event.preventDefault();
      if (timerId) {
        stopTimer();
      } else {
        startTimer();
      }
    });

    document.addEventListener('click', () => {
      stopTimer();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && timerId && wakeLockRequested) {
        requestWakeLock();
      }
    });

    applyBackground(remainingSeconds);
    updateDisplay();
  </script>
</body>
</html>
